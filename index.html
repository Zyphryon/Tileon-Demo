<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Tileon</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101014;
            color: #d0d0d8;
            font: 14px/1.4 system-ui, sans-serif;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            outline: none;
        }

        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="canvas" tabindex="0"></canvas>

    <div id="status">Loading…</div>

    <script>
        const Status = document.getElementById("status");
        const Canvas = document.getElementById("canvas");

        var Module = {
            canvas: Canvas,

            // The world is fetched a file at a time from beside this page, so nothing but the program itself
            // is downloaded before it starts.
            arguments: ["--project=Project/Tileon.tileon"],

            print: (Text) => console.log(Text),
            printErr: (Text) => console.error(Text),

            setStatus: (Text) => {
                Status.textContent = Text;
                Status.style.display = Text ? "flex" : "none";
            },

            onRuntimeInitialized: () => {
                Module.setStatus("");

                // Keys are delivered to the canvas, and a canvas is only sent them while it holds focus.
                Canvas.focus();
            }
        };

        window.onerror = () => Module.setStatus("Something went wrong — see the console.");
    </script>

    <script async src="Tileon_Editor.js"></script>
</body>
</html>
